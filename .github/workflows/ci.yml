# Checks on every agent branch and main push.
# Merge-bot policy is managed separately by the board.
name: CI

on:
  push:
    branches: ["mep/**", "main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast:
    name: fast
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint (biome)
        run: pnpm exec biome check .
      - name: Typecheck
        run: node scripts/typecheck.mjs
      # Integration tests run in their own job. The native SysV IPC test stays local.
      - name: Unit and component tests
        run: |
          files=$(git ls-files '*.test.ts' '*.test.tsx' | grep -v '\.int\.test\.ts$' | grep -v 'packages/db/src/sysv-ipc.test.ts')
          pnpm exec vitest run --project unit --project component $files
        env:
          CI: "1"

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # This project selects only *.int.test.ts; the native SysV IPC test is excluded.
      - name: Integration tests
        run: pnpm exec vitest run --project integration --reporter=default --reporter=json --outputFile=integration-results.json
      - name: Record integration test counts
        if: always() && !cancelled()
        run: pnpm exec tsx scripts/integration-summary.ts integration-results.json

  e2e:
    name: e2e (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CI: "1"
      # Each hosted job owns its VM; the shared-Mac lock is unnecessary here.
      MEP_E2E_LOCK: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Read Playwright version
        id: playwright
        working-directory: apps/web
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-chromium-${{ steps.playwright.outputs.version }}
      - name: Install Chromium and system dependencies
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - name: Install cached Chromium system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --dir apps/web exec playwright install-deps chromium
      - name: Install process cleanup tool
        run: sudo apt-get update && sudo apt-get install -y lsof
      - name: Browser tests
        run: pnpm test:e2e --shard=${{ matrix.shard }}/4 --reporter=list,github,html,json
        env:
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/results.json
      - name: Record cache result
        if: always()
        run: echo 'Chromium cache hit = ${{ steps.browsers.outputs.cache-hit }}' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload browser report and traces
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.shard }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore
